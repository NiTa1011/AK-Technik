<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var cachedTheme = localStorage.getItem("active-theme-data");
          if (cachedTheme) {
            var theme = JSON.parse(cachedTheme);
            var root = document.documentElement;
            if (theme && theme.colors) {
              Object.keys(theme.colors).forEach(function(key) {
                root.style.setProperty("--" + key, theme.colors[key]);
              });
            }
            if (theme.backgroundPattern && theme.backgroundPattern !== "none") {
              root.style.setProperty("--background-pattern", theme.backgroundPattern);
            } else {
              root.style.setProperty("--background-pattern", "none");
            }
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
